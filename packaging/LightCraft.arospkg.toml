id              = "lightcraft"
version         = "0.13.0-aros1"
summary         = "Photo library and non-destructive RAW editor with CPU rendering"
category        = "graphics/edit"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "x86_64"
abi             = "v11"
subdir          = "LightCraft"
icon            = "LightCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "CPU interface and image processing. GPU backends are not included.",
  "Edits and settings are kept in LightCraftData inside the program drawer. Keep it when upgrading.",
  "Neural denoise, SAM, HEIF, MCP stdio and model downloads are unavailable.",
  "Native keyboard and clipboard conversion is limited to Latin-1.",
]

[[requires_system]]
type = "library"
id = "crt.library"

[[requires_system]]
type = "library"
id = "stdlib.library"

[[requires_system]]
type = "library"
id = "m.library"

[[requires_system]]
type = "library"
id = "cybergraphics.library"

[[requires_system]]
type = "library"
id = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-lightcraft"
revision = "v0.13.0-aros1"
built_with = "x86_64 ABIv11, GCC 10.5.0, Rust 1.100.0-nightly (rust-aros), -nix"

[launch]
executable = "LightCraft"
mode = "workbench"
