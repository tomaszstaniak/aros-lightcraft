id              = "lightcraft"
version         = "0.21.1"
summary         = "Photo library and non-destructive RAW developer"
category        = "graphics/edit"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "aarch64"
abi             = "v1"
subdir          = "LightCraft"
icon            = "LightCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "Native Raspberry Pi build (nightly 2026-11-10); needs a nightly from 2026-11-06 or later. Tested in an emulator only.",
  "The CPU renderer redraws only the parts of the window that changed; scrolling, zooming and other changes of the whole window are slower on slow machines.",
  "GUI_RENDERER ToolType: AUTO (default), CPU or GPU. AUTO uses OpenGL only when it is not Mesa software OpenGL.",
  "Settings, the default library and LightCraft.log are kept in LightCraftData in the program drawer; keep it when upgrading.",
  "Develop and export run on the CPU. Not built in: AI Denoise, AI masks, HEIC/HEIF import. Use a library in one LightCraft at a time.",
]

# System libraries the programs open: C runtime first, then window, clipboard and requesters.

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[[requires_system]]
type = "library"
id   = "asl.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-lightcraft"
revision   = "v0.21.1"
archive    = "LightCraft-0.21.1-source.zip"
built_with = "Raspberry Pi AArch64 ABIv1 (nightly 2026-11-10 SDK), Clang 20.1.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "LightCraft"
mode       = "workbench"
